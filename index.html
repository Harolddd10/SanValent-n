<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz San Valentín</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="heartCanvas"></canvas>
        <div class="heart-container">
            <div class="heart"></div>
        </div>
        <h1 class="title">Feliz San Valentín</h1>
        <div class="message">
            <h2>¿Quieres ser mi San Valentín? ❤️</h2>
            <div class="buttons">
                <button id="yes">Sí</button>
                <button id="no">No</button>
            </div>
        </div>
        <div id="love-message" class="hidden">
            <h2>¡Te amo mucho! ❤️</h2>
            <p>Mi nena bubu, eres la persona más especial en mi vida.</p>
            <div class="heart-rain"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
